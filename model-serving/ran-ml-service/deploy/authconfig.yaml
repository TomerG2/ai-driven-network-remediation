# Authorino AuthConfig for ran-ml-service predictor endpoint.
#
# Enforces API key authentication via Bearer token at the Route edge.
# Token and hostname are injected at deploy time — do not hardcode secrets.
#
# Deploy via Make:
#   AUTH_TOKEN=<token> make deploy-ml-authconfig
#
# Usage:
#   curl -H "Authorization: Bearer <token>" https://<route-host>/v1/detect
apiVersion: authorino.kuadrant.io/v1beta3
kind: AuthConfig
metadata:
  name: ran-ml-service-auth
  namespace: model-serving
  labels:
    app.kubernetes.io/name: ran-ml-service
    app.kubernetes.io/part-of: ai-driven-network-remediation
spec:
  hosts:
    - ${ROUTE_HOST}

  authentication:
    "bearer-token":
      credentials:
        authorizationHeader:
          prefix: Bearer
      plain:
        selector: request.headers.authorization.@replace:{"old":"Bearer ","new":""}
      when:
        - selector: request.headers.authorization
          operator: matches
          value: ^Bearer .+

  authorization:
    "validate-token":
      opa:
        rego: |
          token := trim_space(replace(input.request.headers.authorization, "Bearer ", ""))

          allow {
            token == "${AUTH_TOKEN}"
          }

  response:
    unauthenticated:
      code: 401
      headers:
        "content-type":
          plain:
            value: application/json
      body:
        plain:
          value: '{"error":"Unauthorized - valid Bearer token required"}'
    unauthorized:
      code: 403
      headers:
        "content-type":
          plain:
            value: application/json
      body:
        plain:
          value: '{"error":"Forbidden - invalid token"}'
